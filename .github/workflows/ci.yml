name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GHSA-ggr8-5vv4-36mx (deepmerge-ts, high) is exempted via
      # pnpm-workspace.yaml's auditConfig.ignoreGhsas: it's pinned to an exact
      # vulnerable version by @prisma/config even in Prisma's latest 7.x
      # release, so no released Prisma version (major or otherwise) fixes it
      # yet, and it's only reachable via the `prisma` CLI devDependency, never
      # shipped in the pruned production image. See CLAUDE.md's dependency
      # health notes. Remove that entry once Prisma patches it upstream.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Generate Prisma Client
        run: pnpm --filter @wave/backend run prisma:generate

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test
