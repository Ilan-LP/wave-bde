services:
  postgres:
    image: postgres:16-alpine
    container_name: wave-postgres-prod
    restart: unless-stopped
    environment:
      # No insecure defaults here (unlike docker-compose.yml's dev file) —
      # these must be set in .env.production, or the postgres image itself
      # refuses to start with an empty superuser password.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No host port published — only the backend (over the internal Docker
    # network) needs to reach Postgres in production.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: wave-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${BACKEND_PORT:-3000}
      # Assembled from the postgres service's own env vars (not read from a
      # host-side DATABASE_URL) so it always resolves to the `postgres`
      # service hostname on the compose network.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID}
    # No host port published — this machine already runs a separate Caddy
    # container (for another, unrelated project) that owns ports 80/443.
    # That existing Caddy reaches this service over the shared external
    # network below, by container name (wave-backend-prod) — see
    # deploy/wave.caddy and DEPLOY.md.
    expose:
      - "${BACKEND_PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${BACKEND_PORT:-3000}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default
      - caddy_net

networks:
  # PLACEHOLDER: must match the Docker network the existing Caddy container
  # (running for another project on this machine) is already attached to —
  # confirm the real name on the actual machine (e.g. `docker network ls`,
  # or `docker inspect <existing-caddy-container>`) before deploying. See
  # DEPLOY.md.
  caddy_net:
    external: true
    name: ${CADDY_EXTERNAL_NETWORK:-caddy_net}

volumes:
  postgres_data:
